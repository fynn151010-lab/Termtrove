name: Check TermTrove
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Start isolated local Supabase
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/termtrove-supabase.log" 2>&1
      - run: node scripts/write-local-env.mjs
      - run: npm run test:integration
      - if: always()
        run: supabase stop
